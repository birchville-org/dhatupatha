site_name: Pāṇinīya-Dhātupāṭha (Kanonische Neuedition)
site_url: https://birchville-org.github.io/dhatupatha/
site_author: Marco Demarmels
site_description: Kanonische Ground-Truth, bilinguale Facing-Page-Alignment-Pipeline und layouttreue Typst-Vektorneuedition für 2.259 Verbalwurzeln nach dem Böhtlingk-Standard.
repo_url: https://github.com/birchville-org/dhatupatha
repo_name: birchville-org/dhatupatha

theme:
  name: material
  language: de
  logo: assets/birchville_logo.png
  favicon: assets/birchville_logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Modus wechseln
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Zum hellen Modus wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/birchville.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: de
          name: Deutsch
          build: true
          default: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Startseite: Home
            Fallstudie: Case Study
            QA- & Korrektur-Workflow: QA & Correction Workflow
            Urheberrecht & Provenienz: Copyright & Provenance
            Datenarchitektur: Data Architecture
            Konventionen: Conventions
            Wiki-Übersicht: Wiki Overview

nav:
  - Startseite: index.md
  - Fallstudie: case-study.md
  - QA- & Korrektur-Workflow: qa-workflow.md
  - Urheberrecht & Provenienz: copyright-and-provenance.md
  - Datenarchitektur: data-architecture.md
  - Konventionen: conventions.md
  - Wiki-Übersicht: wiki-home.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
